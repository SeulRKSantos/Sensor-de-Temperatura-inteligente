services:
  mariadb:
    image: mariadb:11
    container_name: thguard-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - thguard-net

  influxdb:
    image: influxdb:2
    container_name: thguard-influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
      - DOCKER_INFLUXDB_INIT_RETENTION=720h
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - thguard-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: thguard-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-certs:/mosquitto/certs
    networks:
      - thguard-net

  backend:
    build: ./backend
    container_name: thguard-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    volumes:
      - ./backend/data:/app/data
    depends_on:
      mariadb:
        condition: service_healthy
      influxdb:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - thguard-net

  frontend:
    build: ./frontend
    container_name: thguard-frontend
    restart: unless-stopped
    networks:
      - thguard-net

  nginx:
    image: nginx:alpine
    container_name: thguard-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - thguard-net

volumes:
  mariadb-data:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
  mosquitto-certs:

networks:
  thguard-net:
    driver: bridge
